name: Aikido Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Aikido CI scan
        run: npx @aikido/ci-scanner
        env:
          AIKIDO_SECRET_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
